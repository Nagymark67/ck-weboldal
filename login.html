<!DOCTYPE html>
<html lang="hu">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><link rel="icon" type="image/png" href="ck_cimer_szines.png"><title>Bejelentkezés | Cantusok Köre</title><link rel="stylesheet" href="ck_fooldal.css"></head>
<body>
  <header class="site-header"><div class="header-inner"><a class="brand" href="/"><img src="ck_cimer_szines.png" alt="Cantusok Köre logó"><span>Cantusok Köre</span></a><a class="button button-light" href="/">Főoldal</a></div></header>
  <main class="page-shell"><div class="form-card"><p class="eyebrow">Üdv újra</p><h2>Bejelentkezés</h2><form id="loginForm"><input type="text" id="username" placeholder="Felhasználónév" autocomplete="username" required><div class="password-field"><input type="password" id="password" placeholder="Jelszó" autocomplete="current-password" required><button class="password-toggle" type="button" aria-label="Jelszó megjelenítése" aria-pressed="false">👁</button></div><button type="submit">Bejelentkezés</button></form><form id="passwordResetForm" hidden><p>A jelszavad vissza lett állítva. Állíts be egy új jelszót a folytatáshoz.</p><div class="password-field"><input type="password" id="newPassword" placeholder="Új jelszó" autocomplete="new-password" minlength="8" required><button class="password-toggle" type="button" aria-label="Jelszó megjelenítése" aria-pressed="false">👁</button></div><div class="password-field"><input type="password" id="newPasswordAgain" placeholder="Új jelszó ismét" autocomplete="new-password" minlength="8" required><button class="password-toggle" type="button" aria-label="Jelszó megjelenítése" aria-pressed="false">👁</button></div><button type="submit">Új jelszó mentése</button></form><p>Még nincs fiókod? <a href="register.html">Regisztráció</a></p><p id="loginMessage" class="news-meta"></p></div></main><footer>© 2026 Cantusok Köre. Minden jog fenntartva.</footer>
  <script src="api-config.js"></script>
  <script src="site.js"></script>
  <script>
    document.querySelectorAll('.password-toggle').forEach((toggle) => {
      toggle.addEventListener('click', () => {
        const input = toggle.parentElement.querySelector('input');
        const visible = input.type === 'text';
        input.type = visible ? 'password' : 'text';
        toggle.textContent = '👁';
        toggle.setAttribute('aria-label', visible ? 'Jelszó megjelenítése' : 'Jelszó elrejtése');
        toggle.setAttribute('aria-pressed', String(!visible));
      });
    });
    if (new URLSearchParams(window.location.search).get('reason') === 'inactivity') {
      document.getElementById('loginMessage').textContent = 'Két perc tétlenség után automatikusan kijelentkeztettünk.';
    }
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const loginForm = event.currentTarget;
      const message = document.getElementById('loginMessage');
      const button = loginForm.querySelector('button[type="submit"]');
      button.disabled = true;
      try {
        const response = await window.ckApiFetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('username').value.trim(), password: document.getElementById('password').value }) });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || `HTTP ${response.status}`);
        if (data.requiresPasswordChange) {
          loginForm.hidden = true;
          document.getElementById('passwordResetForm').hidden = false;
          message.textContent = 'A folytatáshoz új jelszót kell beállítanod.';
          return;
        }
        window.location.href = 'index.html';
      } catch (error) { message.textContent = `Sikertelen bejelentkezés: ${error.message}`; }
      finally { button.disabled = false; }
    });
    document.getElementById('passwordResetForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = document.getElementById('loginMessage');
      const password = document.getElementById('newPassword').value;
      const passwordAgain = document.getElementById('newPasswordAgain').value;
      if (password !== passwordAgain) { message.textContent = 'A két új jelszó nem egyezik.'; return; }
      const button = event.currentTarget.querySelector('button[type="submit"]');
      button.disabled = true;
      try {
        const response = await window.ckApiFetch('/password-reset/complete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || `HTTP ${response.status}`);
        window.location.href = 'index.html';
      } catch (error) {
        message.textContent = `Hiba: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
