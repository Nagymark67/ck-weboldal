<!DOCTYPE html>
<html lang="hu">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bejelentkezés | Cantusok Köre</title><link rel="stylesheet" href="ck_fooldal.css"></head>
<body>
  <header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><img src="ck_cimer_szines.png" alt="Cantusok Köre logó"><span>Cantusok Köre</span></a><a class="button button-light" href="index.html">Főoldal</a></div></header>
  <main class="page-shell"><div class="form-card"><p class="eyebrow">Üdv újra</p><h2>Bejelentkezés</h2><form id="loginForm"><input type="text" id="username" placeholder="Felhasználónév" autocomplete="username" required><input type="password" id="password" placeholder="Jelszó" autocomplete="current-password" required><button type="submit">Bejelentkezés</button></form><p>Még nincs fiókod? <a href="register.html">Regisztráció</a></p><p id="loginMessage" class="news-meta"></p></div></main><footer>© 2026 Cantusok Köre. Minden jog fenntartva.</footer>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = document.getElementById('loginMessage');
      const button = event.currentTarget.querySelector('button');
      button.disabled = true; button.textContent = 'Bejelentkezés…';
      try {
        const response = await fetch('/login', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: username.value, password: password.value }) });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || `HTTP ${response.status}`);
        window.location.href = 'index.html';
      } catch (error) { message.textContent = `Sikertelen bejelentkezés: ${error.message}`; }
      finally { button.disabled = false; button.textContent = 'Bejelentkezés'; }
    });
  </script>
</body>
</html>
